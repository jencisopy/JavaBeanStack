# Mensajes de los errores de la librería que no son reglas del catálogo (plan JBSSIF, §3.8, D33 Parte C).
#
# Una clave por código de CodigoError (el mensaje para pantalla) y otra <código>.accion (qué hacer).
# Los marcadores {0}, {1}… se reemplazan literalmente; nunca llevan datos personales. El test
# MensajesErroresTest exige las dos claves para cada constante y ninguna huérfana.
# Codificación: UTF-8 (lo lee ResourceBundle desde Java 9).

# ------------------------------------------------------------------ ENTRADA (argumentos)
JBS-ENT-01=El lote tiene {0} documentos y SIFEN admite como máximo 50 por envío.
JBS-ENT-01.accion=Divida el envío en lotes de hasta 50 documentos.
JBS-ENT-02=Los documentos {0} y {1} del lote tienen el mismo CDC.
JBS-ENT-02.accion=Quite el documento repetido del lote.
JBS-ENT-03=El CDC a consultar no es válido: debe tener 44 dígitos y un dígito verificador correcto.
JBS-ENT-03.accion=Revise el CDC del documento que quiere consultar.
JBS-ENT-04=El RUC a consultar no es válido: debe tener entre 3 y 8 caracteres alfanuméricos, sin el dígito verificador.
JBS-ENT-04.accion=Revise el RUC (sin guion ni dígito verificador).
JBS-ENT-05=El número de lote a consultar no es válido: debe ser numérico.
JBS-ENT-05.accion=Use el número de lote que devolvió SIFEN al recibir el envío.
JBS-ENT-06=No se pudo leer el archivo de configuración de SIFEN: {0}.
JBS-ENT-06.accion=Verifique la ruta, que sea un archivo y los permisos de lectura.
JBS-ENT-07=Faltan datos del documento para calcular el CDC: {0}.
JBS-ENT-07.accion=Complete los datos indicados (timbrado, emisor, fecha de emisión, tipo de emisión y código de seguridad).
JBS-ENT-08=Ya hay un envío en curso de este documento: no se puede enviar dos veces a la vez.
JBS-ENT-08.accion=Espere el resultado del envío en curso; si quedó desconocido, resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo.
JBS-ENT-09=El lote mezcla documentos de distinto tipo o de distinto emisor ({0}): SIFEN admite en un lote un solo tipo de documento y un solo RUC.
JBS-ENT-09.accion=Separe los documentos en lotes de un solo tipo de documento y un solo emisor.
JBS-ENT-10=El rango de numeración a inutilizar no es válido: {0}.
JBS-ENT-10.accion=Revise el rango: timbrado numérico, tipo de documento, establecimiento, punto de expedición y números desde y hasta.
JBS-ENT-11=El lote no tiene documentos para enviar o tiene uno vacío ({0}).
JBS-ENT-11.accion=Arme el lote con los documentos firmados que quiere enviar (de 1 a 50), sin elementos nulos.
JBS-ENT-12=El documento se firmó para el ambiente {0} y este cliente opera en {1}: no se envía.
JBS-ENT-12.accion=Envíe el documento con el cliente de su ambiente: un documento de pruebas no va a producción ni al revés. Si el ambiente no se pudo determinar, revise el QR del XML firmado.
JBS-ENT-13=El registro de envíos de la aplicación no autorizó el envío de este documento.
JBS-ENT-13.accion=Revise el estado del documento en la aplicación: puede estar ya enviado, aprobado o en envío desde otro servidor.
JBS-ENT-14=sendEvents admite un evento por llamada; se recibieron {0}.
JBS-ENT-14.accion=Envíe los eventos de a uno, cada uno con su propia llamada.

# ------------------------------------------------------------------ ENTRADA (XML que se lee)
JBS-XML-01=No se recibió el XML del documento (está vacío).
JBS-XML-01.accion=Verifique que el XML se haya leído correctamente antes de procesarlo.
JBS-XML-02=El XML no contiene un documento electrónico (falta el nodo DE).
JBS-XML-02.accion=Verifique que el archivo sea el XML de un documento electrónico de SIFEN.
JBS-XML-03=El XML está mal formado y no se puede leer.
JBS-XML-03.accion=Verifique que el archivo esté completo y sea un XML válido.
JBS-XML-04=Al documento del XML le falta un dato necesario para calcular el CDC.
JBS-XML-04.accion=Verifique que el XML tenga el timbrado, el emisor, la fecha de emisión y el código de seguridad.
JBS-XML-05=El valor del campo {0} del XML no tiene el formato esperado.
JBS-XML-05.accion=Corrija el campo indicado en el XML (número, fecha o código fuera de la tabla del MT).
JBS-XML-06=Al XML firmado le falta {0}: no es un documento electrónico firmado.
JBS-XML-06.accion=Use el XML que devolvió la firma del documento, completo y sin editarlo.
JBS-XML-07=El {0} del XML firmado no corresponde a sus datos o a su firma: el XML se modificó después de firmarlo.
JBS-XML-07.accion=No edite el XML firmado: si hay que cambiar un dato, firme el documento de nuevo.

# ------------------------------------------------------------------ FIRMA y QR
JBS-FIRMA-01=No se encontró o no se puede leer el archivo XML cuya firma se quiere validar.
JBS-FIRMA-01.accion=Verifique la ruta y los permisos del archivo.
JBS-FIRMA-02=La plataforma Java no tiene disponibles los algoritmos de firma que exige SIFEN (RSA-SHA256, C14N exclusiva).
JBS-FIRMA-02.accion=Avise a soporte con el id de referencia: revise la JVM y los proveedores de seguridad del servidor.
JBS-FIRMA-03=No se pudo firmar el documento con el certificado configurado.
JBS-FIRMA-03.accion=Avise a soporte con el id de referencia.
JBS-FIRMA-04=No se pudo generar el enlace del código QR del documento.
JBS-FIRMA-04.accion=Verifique los totales del documento y el CSC de la configuración; si persiste, avise a soporte con el id de referencia.
JBS-FIRMA-05=El certificado de la firma no informa el RUC o documento del titular: no se puede verificar que firmó el emisor.
JBS-FIRMA-05.accion=El documento se firmó con un certificado que no es de facturación electrónica: consulte al emisor.

# ------------------------------------------------------------------ CONEXION
JBS-CONEX-01=No se pudo resolver el nombre del servidor de SIFEN ({0}).
JBS-CONEX-01.accion=Verifique la conexión a Internet y el DNS del servidor; si hay proxy, que esté configurado.
JBS-CONEX-02=El proxy {0} no permitió la conexión con SIFEN.
JBS-CONEX-02.accion=Avise a TI: verifique la dirección, el puerto y las credenciales del proxy.
JBS-CONEX-03=No se pudo conectar con el servidor de SIFEN ({0}): la conexión fue rechazada o no hay ruta.
JBS-CONEX-03.accion=Verifique la conexión y el firewall; reintente en unos minutos.
JBS-CONEX-04=Se agotó el tiempo de espera ({0} s) al conectar con SIFEN.
JBS-CONEX-04.accion=Reintente en unos minutos; si persiste, avise a TI (proxy, firewall o red).
JBS-CONEX-05=SIFEN no respondió en {0} s.
JBS-CONEX-05.accion=En un envío el resultado es desconocido: resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo (un lote: consúltelo con su número).
JBS-CONEX-06=Falló la conexión segura (TLS) con SIFEN: el certificado de cliente fue rechazado o el del servidor no es de confianza.
JBS-CONEX-06.accion=Avise al administrador: verifique el certificado de cliente y el almacén de confianza del servidor.
JBS-CONEX-07=La conexión con SIFEN se cortó durante el intercambio.
JBS-CONEX-07.accion=Reintente; en un envío, consulte antes el documento o el lote porque el resultado es desconocido.
JBS-CONEX-08=SIFEN o un intermediario rechazó el pedido (HTTP {0}).
JBS-CONEX-08.accion=Verifique la URL de los servicios de la configuración. En un envío el resultado es desconocido: resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo.
JBS-CONEX-09=El servidor de SIFEN o un intermediario tuvo un error (HTTP {0}).
JBS-CONEX-09.accion=En un envío el resultado es desconocido: resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo (un lote: consúltelo con su número). En una consulta, reintente en unos minutos.
JBS-CONEX-10=La respuesta recibida no es de SIFEN (HTTP {0}): puede ser la página de un proxy o un portal.
JBS-CONEX-10.accion=Avise a TI: un proxy o un filtro responde en lugar de SIFEN. En un envío el resultado es desconocido: resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo.
JBS-CONEX-11=El proxy {0} rechazó el usuario o la clave configurados.
JBS-CONEX-11.accion=Avise a TI: verifique sifen.proxy.user y sifen.proxy.pass; con un destino https y un proxy Basic, la JVM del servidor necesita -Djdk.http.auth.tunneling.disabledSchemes= (vacío).

# ------------------------------------------------------------------ RESPUESTA_SIFEN
JBS-RESP-01=SIFEN respondió con un error del servicio (SOAP Fault).
JBS-RESP-01.accion=En un envío, resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo; avise a soporte con el id de referencia (el detalle técnico trae el código y el texto del Fault).
JBS-RESP-02=La respuesta de SIFEN está vacía o no es la que corresponde a la operación.
JBS-RESP-02.accion=En un envío el resultado es desconocido: resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo. En una consulta, reintente; si persiste, avise a soporte con el id de referencia.
JBS-RESP-03=No se pudo interpretar el contenido de la respuesta de SIFEN.
JBS-RESP-03.accion=En un envío, resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo; avise a soporte con el id de referencia.
JBS-RESP-04=La respuesta de SIFEN no trae el código de resultado.
JBS-RESP-04.accion=Consulte el documento o el lote para conocer su estado; avise a soporte con el id de referencia.
JBS-RESP-05=SIFEN devolvió un código de resultado con un formato desconocido.
JBS-RESP-05.accion=La respuesta se devolvió igual; revise el código y el mensaje de SIFEN.
JBS-RESP-06=Un dato de la respuesta de SIFEN tiene un formato inesperado.
JBS-RESP-06.accion=En un envío, resuélvalo con resolve (consulta por CDC y reenvía una vez solo si SIFEN no lo tiene), nunca reenviándolo; avise a soporte con el id de referencia.
JBS-RESP-07=SIFEN informó la recepción o la aprobación sin el número que la identifica.
JBS-RESP-07.accion=Consulte el documento o el lote para confirmar su estado antes de seguir.
JBS-RESP-08=SIFEN informa que el documento ya está registrado o todavía no confirma su estado (respuesta {0}).
JBS-RESP-08.accion=No reenvíe ni vuelva a firmar el documento: déjelo como resultado desconocido y resuélvalo más tarde con resolve.

# ------------------------------------------------------------------ INTERNO
JBS-INT-00=Ocurrió un error interno en la librería de SIFEN.
JBS-INT-00.accion=Avise a soporte con el id de referencia: el detalle está en el log del servidor.
JBS-INT-01=No se pudo armar el XML del documento.
JBS-INT-01.accion=Avise a soporte con el id de referencia: puede ser una versión de SAAJ incompatible en el servidor.
JBS-INT-02=No se pudo convertir el XML a texto.
JBS-INT-02.accion=Avise a soporte con el id de referencia.
JBS-INT-03=Falta un recurso de mensajes de la librería.
JBS-INT-03.accion=Avise a soporte: el jar de jbs-sifen está incompleto o mal empaquetado.
JBS-INT-04=La operación {0} no está disponible en esta versión de la librería de SIFEN.
JBS-INT-04.accion=Avise a soporte con el id de referencia: la versión de jbs-sifen instalada todavía no incluye esa operación.
JBS-EST-01=La configuración global de SIFEN se cambió mientras había operaciones en curso.
JBS-EST-01.accion=Fije la configuración al arrancar o pase la configuración a cada operación.
JBS-EST-02=El mismo documento se estaba generando en dos hilos a la vez.
JBS-EST-02.accion=No comparta un mismo DocumentoElectronico entre hilos.
