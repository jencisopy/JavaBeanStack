# Mensajes de la validación previa del DE (jbs-sifen, paquete org.javabeanstack.sifen.core.validation).
#
# Único lugar de los textos (UTF-8). Una clave por código de regla; la prueba CatalogoReglasTest exige
# que cada regla del catálogo tenga su clave y que no haya claves huérfanas.
# Marcadores {0}, {1}...: detalles de la regla (largo, dominio, grupo), nunca datos del documento.
# Orden: el del catálogo de reglas (una sección por grupo del MT); las reglas de cada grupo se
# agregan al implementarlas.
# Las claves con prefijo "aux." no son reglas: son los textos auxiliares de la librería (I3-05) y la
# prueba de huérfanos las excluye; ValidationMessages.CLAVES_AUXILIARES lista las que se usan.

# --- aux: textos auxiliares ---
aux.regla.sinMensaje=Regla {0}: el dato no cumple la validación previa.
aux.valor.largo=largo {0}
aux.valor.cantidad=cantidad {0}
aux.marca.aviso=(AVISO)
aux.resumen.errores.uno=1 error
aux.resumen.errores.varios={0} errores
aux.resumen.avisos.uno=1 aviso
aux.resumen.avisos.varios={0} avisos
aux.resumen.y={0} y {1}
aux.resumen.mas=y {0} más
aux.configuracion.invalida=La configuración de la librería no es válida

# --- VAL: reglas internas del validador ---
JBS-VAL-00=Error interno del validador en el grupo {0} ({1}): no se pudieron evaluar sus reglas. Revise el registro de la aplicación.
JBS-VAL-01=No se recibió el documento a validar (documento electrónico o evento).
JBS-VAL-02=Se validó sin contexto de generación: las reglas que dependen de la configuración usaron los valores por defecto.

# --- Reglas del catálogo (A-J, eventos, VAL-03) ---
# Desde §3.6 (D33) este archivo es la FUENTE de los mensajes de las reglas (la identidad de cada regla
# está en su ficha, en el conjunto de su subgrupo). El catálogo .md los toma de acá con
# .claude/tools/sifen_catalogo_reglas.py --generar-md. Una regla nueva agrega su clave en el mismo cambio.

